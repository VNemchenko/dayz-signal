x-dayz-signal-base: &dayz_signal_base
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 15s

services:
  dayz-signal-server1:
    <<: *dayz_signal_base
    container_name: dayz-signal-server1
    environment:
      SERVICE_NAME: ${SERVER1_NAME:-dayz-server-1}
      SERVER_ID: ${SERVER1_ID:-livonia-1}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      STARTUP_TIMEOUT_MS: ${SERVER1_STARTUP_TIMEOUT_MS:-15000}
      SHUTDOWN_GRACE_MS: ${SERVER1_SHUTDOWN_GRACE_MS:-10000}
      API_KEY: ${SERVER1_API_KEY:-}
      API_KEY_FILE: ${SERVER1_API_KEY_FILE:-}
      RCON_HOST: ${SERVER1_RCON_HOST:?SERVER1_RCON_HOST is required}
      RCON_PORT: ${SERVER1_RCON_PORT:-2305}
      RCON_PASSWORD: ${SERVER1_RCON_PASSWORD:-}
      RCON_PASSWORD_FILE: ${SERVER1_RCON_PASSWORD_FILE:-}
      RCON_CONNECTION_TYPE: ${SERVER1_RCON_CONNECTION_TYPE:-udp4}
      RCON_CONNECTION_TIMEOUT_MS: ${SERVER1_RCON_CONNECTION_TIMEOUT_MS:-50000}
      RCON_CONNECTION_INTERVAL_MS: ${SERVER1_RCON_CONNECTION_INTERVAL_MS:-5000}
      RCON_KEEPALIVE_MS: ${SERVER1_RCON_KEEPALIVE_MS:-10000}
      RCON_COMMAND_TIMEOUT_MS: ${SERVER1_RCON_COMMAND_TIMEOUT_MS:-7000}
      RCON_RECONNECT_BASE_MS: ${SERVER1_RCON_RECONNECT_BASE_MS:-1000}
      RCON_RECONNECT_MAX_MS: ${SERVER1_RCON_RECONNECT_MAX_MS:-30000}
      JOURNAL_PATH: /data/broadcasts.jsonl
      QUEUE_CAPACITY: ${SERVER1_QUEUE_CAPACITY:-50}
      BROADCAST_TTL_SECONDS: ${SERVER1_BROADCAST_TTL_SECONDS:-30}
      BROADCAST_MAX_TTL_SECONDS: ${SERVER1_BROADCAST_MAX_TTL_SECONDS:-300}
      COMMAND_MAX_FUTURE_SKEW_SECONDS: ${SERVER1_COMMAND_MAX_FUTURE_SKEW_SECONDS:-30}
      IDEMPOTENCY_RETENTION_MS: ${SERVER1_IDEMPOTENCY_RETENTION_MS:-86400000}
      IDEMPOTENCY_MAX_RECORDS: ${SERVER1_IDEMPOTENCY_MAX_RECORDS:-10000}
      JOURNAL_MAX_BYTES: ${SERVER1_JOURNAL_MAX_BYTES:-16777216}
      RATE_LIMIT_PER_MINUTE: ${SERVER1_RATE_LIMIT_PER_MINUTE:-30}
      RATE_LIMIT_BURST: ${SERVER1_RATE_LIMIT_BURST:-5}
    ports:
      - "${SERVER1_BIND_HOST:-127.0.0.1}:${SERVER1_HTTP_PORT:-8081}:8080"
    volumes:
      - dayz_signal_server1_data:/data

  dayz-signal-server2:
    <<: *dayz_signal_base
    container_name: dayz-signal-server2
    environment:
      SERVICE_NAME: ${SERVER2_NAME:-dayz-server-2}
      SERVER_ID: ${SERVER2_ID:-dayz-server-2}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      STARTUP_TIMEOUT_MS: ${SERVER2_STARTUP_TIMEOUT_MS:-15000}
      SHUTDOWN_GRACE_MS: ${SERVER2_SHUTDOWN_GRACE_MS:-10000}
      API_KEY: ${SERVER2_API_KEY:-}
      API_KEY_FILE: ${SERVER2_API_KEY_FILE:-}
      RCON_HOST: ${SERVER2_RCON_HOST:?SERVER2_RCON_HOST is required}
      RCON_PORT: ${SERVER2_RCON_PORT:-2305}
      RCON_PASSWORD: ${SERVER2_RCON_PASSWORD:-}
      RCON_PASSWORD_FILE: ${SERVER2_RCON_PASSWORD_FILE:-}
      RCON_CONNECTION_TYPE: ${SERVER2_RCON_CONNECTION_TYPE:-udp4}
      RCON_CONNECTION_TIMEOUT_MS: ${SERVER2_RCON_CONNECTION_TIMEOUT_MS:-50000}
      RCON_CONNECTION_INTERVAL_MS: ${SERVER2_RCON_CONNECTION_INTERVAL_MS:-5000}
      RCON_KEEPALIVE_MS: ${SERVER2_RCON_KEEPALIVE_MS:-10000}
      RCON_COMMAND_TIMEOUT_MS: ${SERVER2_RCON_COMMAND_TIMEOUT_MS:-7000}
      RCON_RECONNECT_BASE_MS: ${SERVER2_RCON_RECONNECT_BASE_MS:-1000}
      RCON_RECONNECT_MAX_MS: ${SERVER2_RCON_RECONNECT_MAX_MS:-30000}
      JOURNAL_PATH: /data/broadcasts.jsonl
      QUEUE_CAPACITY: ${SERVER2_QUEUE_CAPACITY:-50}
      BROADCAST_TTL_SECONDS: ${SERVER2_BROADCAST_TTL_SECONDS:-30}
      BROADCAST_MAX_TTL_SECONDS: ${SERVER2_BROADCAST_MAX_TTL_SECONDS:-300}
      COMMAND_MAX_FUTURE_SKEW_SECONDS: ${SERVER2_COMMAND_MAX_FUTURE_SKEW_SECONDS:-30}
      IDEMPOTENCY_RETENTION_MS: ${SERVER2_IDEMPOTENCY_RETENTION_MS:-86400000}
      IDEMPOTENCY_MAX_RECORDS: ${SERVER2_IDEMPOTENCY_MAX_RECORDS:-10000}
      JOURNAL_MAX_BYTES: ${SERVER2_JOURNAL_MAX_BYTES:-16777216}
      RATE_LIMIT_PER_MINUTE: ${SERVER2_RATE_LIMIT_PER_MINUTE:-30}
      RATE_LIMIT_BURST: ${SERVER2_RATE_LIMIT_BURST:-5}
    ports:
      - "${SERVER2_BIND_HOST:-127.0.0.1}:${SERVER2_HTTP_PORT:-8082}:8080"
    volumes:
      - dayz_signal_server2_data:/data

volumes:
  dayz_signal_server1_data:
  dayz_signal_server2_data:
